<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Voice Blackboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app-shell">
      <div class="controls">
        <button id="listen-button" class="primary-button" type="button" disabled>
          start
        </button>
        <button id="clear-button" type="button">clear</button>
      </div>

      <p id="status" class="visually-hidden" aria-live="polite"></p>

      <section
        id="blackboard"
        class="blackboard"
        aria-label="Spoken phrase responses"
      >
        <div id="board-content" class="board-content"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
